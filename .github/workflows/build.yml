name: Build XboxWine Shelf

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out XboxWine Shelf
        uses: actions/checkout@v6

      - name: Restore compiled BoxedWine cache
        id: boxedwine-cache
        uses: actions/cache/restore@v4
        with:
          path: work/boxedwine
          key: boxedwine-uwp-windows2022-x64-official-sdl-v3

      - name: Restore official SDL2 UWP cache
        id: sdl2-cache
        uses: actions/cache/restore@v4
        with:
          path: work/sdl2-uwp
          key: sdl2-uwp-release-2.28.5-v143-x64-v1

      - name: Enable MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download and patch BoxedWine UWP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archive = Join-Path $env:RUNNER_TEMP "boxedwine-uwp.zip"
          $extract = Join-Path $env:GITHUB_WORKSPACE "work\source"
          $repoRoot = Join-Path $env:GITHUB_WORKSPACE "work\boxedwine"
          $solution = Join-Path $repoRoot "project\msvc\BoxedWine\BoxedWine.sln"

          if (-not (Test-Path $solution)) {
              Write-Host "No compiled cache found. Downloading BoxedWine UWP."

              New-Item -ItemType Directory -Force $extract | Out-Null

              curl.exe `
                --fail `
                --location `
                --retry 5 `
                --retry-all-errors `
                "https://codeload.github.com/worleydl/Boxedwine-uwp/zip/refs/heads/uwp-compat" `
                --output $archive

              Expand-Archive -Path $archive -DestinationPath $extract -Force

              $downloaded = Get-ChildItem $extract -Directory |
                  Where-Object { $_.Name -like "Boxedwine-uwp-*" } |
                  Select-Object -First 1

              if (-not $downloaded) {
                  throw "Downloaded BoxedWine folder was not found."
              }

              if (Test-Path $repoRoot) {
                  Remove-Item $repoRoot -Recurse -Force
              }

              Move-Item $downloaded.FullName $repoRoot
          } else {
              Write-Host "Reusing cached BoxedWine source and compiled outputs."
          }

          .\apply-patch.ps1 -RepoRoot $repoRoot

          "BOXEDWINE_ROOT=$repoRoot" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $manifestPath = Join-Path `
              $repoRoot `
              "project\msvc\BoxedWine\uwp\Package.appxmanifest"

          $manifestText = Get-Content -Raw $manifestPath
          if (-not $manifestText.Contains('Version="0.2.8.0"')) {
              throw "Manifest version verification failed. Expected 0.2.8.0."
          }

          Write-Host "Verified package identity version 0.2.8.0."

      - name: Build official SDL2 UWP renderer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force ".\logs" | Out-Null

          $sdlWork = Join-Path $env:GITHUB_WORKSPACE "work\sdl2-uwp"
          $sdlSource = Join-Path $sdlWork "source"
          $builtDll = Join-Path $sdlWork "output\SDL2.dll"
          $builtLib = Join-Path $sdlWork "output\SDL2.lib"
          $builtInclude = Join-Path $sdlWork "include"

          if (-not (Test-Path $builtDll) -or -not (Test-Path $builtLib)) {
              Remove-Item $sdlWork -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force $sdlSource | Out-Null

              $archive = Join-Path $env:RUNNER_TEMP "SDL2-2.28.5.zip"

              curl.exe `
                --fail `
                --location `
                --retry 5 `
                --retry-all-errors `
                "https://codeload.github.com/libsdl-org/SDL/zip/refs/tags/release-2.28.5" `
                --output $archive

              Expand-Archive -Path $archive -DestinationPath $sdlSource -Force

              $sdlRoot = Get-ChildItem $sdlSource -Directory |
                  Where-Object { $_.Name -like "SDL-*" } |
                  Select-Object -First 1

              if (-not $sdlRoot) {
                  throw "Official SDL2 source folder was not found."
              }

              $sdlSolution = Join-Path `
                  $sdlRoot.FullName `
                  "VisualC-WinRT\SDL-UWP.sln"

              if (-not (Test-Path $sdlSolution)) {
                  Write-Host "SDL source root contents:"
                  Get-ChildItem $sdlRoot.FullName |
                      Select-Object Name, FullName

                  Write-Host "VisualC-WinRT contents:"
                  Get-ChildItem `
                      (Join-Path $sdlRoot.FullName "VisualC-WinRT") `
                      -ErrorAction SilentlyContinue |
                      Select-Object Name, FullName

                  throw "Official SDL2 UWP solution was not found at $sdlSolution."
              }

              Write-Host "Using SDL UWP solution: $sdlSolution"

              msbuild.exe $sdlSolution `
                  /m `
                  /t:Build `
                  /p:Configuration=Release `
                  /p:Platform=x64 `
                  /p:PlatformToolset=v143 `
                  /p:WindowsTargetPlatformVersion=10.0.19041.0 `
                  /bl:".\logs\sdl2.binlog"

              if ($LASTEXITCODE -ne 0) {
                  throw "Official SDL2 UWP build failed with exit code $LASTEXITCODE."
              }

              $dll = Get-ChildItem `
                  $sdlRoot.FullName `
                  -Recurse `
                  -Filter "SDL2.dll" |
                  Where-Object {
                      $_.FullName -match "[\\/]x64[\\/]" -and
                      $_.FullName -match "[\\/]Release[\\/]"
                  } |
                  Sort-Object Length -Descending |
                  Select-Object -First 1

              $lib = Get-ChildItem `
                  $sdlRoot.FullName `
                  -Recurse `
                  -Filter "SDL2.lib" |
                  Where-Object {
                      $_.FullName -match "[\\/]x64[\\/]" -and
                      $_.FullName -match "[\\/]Release[\\/]"
                  } |
                  Sort-Object Length -Descending |
                  Select-Object -First 1

              if (-not $dll -or -not $lib) {
                  throw "Official SDL2 UWP DLL or import library was not produced."
              }

              New-Item `
                  -ItemType Directory `
                  -Force `
                  (Split-Path $builtDll) | Out-Null
              New-Item `
                  -ItemType Directory `
                  -Force `
                  $builtInclude | Out-Null

              Copy-Item $dll.FullName $builtDll -Force
              Copy-Item $lib.FullName $builtLib -Force
              Copy-Item `
                  (Join-Path $sdlRoot.FullName "include\*.h") `
                  $builtInclude `
                  -Force
          } else {
              Write-Host "Reusing cached official SDL2 UWP build."
          }

          $deps = Join-Path `
              $env:BOXEDWINE_ROOT `
              "project\msvc\BoxedWine\deps"

          New-Item -ItemType Directory -Force (Join-Path $deps "bin") | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $deps "lib") | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $deps "include\SDL2") | Out-Null

          Copy-Item $builtDll (Join-Path $deps "bin\SDL2.dll") -Force
          Copy-Item $builtLib (Join-Path $deps "lib\SDL2.lib") -Force
          Copy-Item `
              (Join-Path $builtInclude "*.h") `
              (Join-Path $deps "include\SDL2") `
              -Force

          Write-Host "Replaced the crashing custom OpenGL SDL2.dll."
          Get-Item `
              (Join-Path $deps "bin\SDL2.dll"), `
              (Join-Path $deps "lib\SDL2.lib") |
              Select-Object FullName, Length, LastWriteTime

      - name: Save official SDL2 UWP cache
        if: steps.sdl2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/sdl2-uwp
          key: sdl2-uwp-release-2.28.5-v143-x64-v1

      - name: Compile XboxWine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force ".\logs" | Out-Null

          $solution = Join-Path `
              $env:BOXEDWINE_ROOT `
              "project\msvc\BoxedWine\BoxedWine.sln"

          msbuild.exe $solution `
              /m `
              /restore `
              /t:Build `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /p:GenerateAppxPackageOnBuild=false `
              /p:AppxPackageSigningEnabled=false `
              /p:AppxBundle=Never `
              /bl:".\logs\compile.binlog"

          if ($LASTEXITCODE -ne 0) {
              throw "Compilation failed with exit code $LASTEXITCODE."
          }

      - name: Save compiled BoxedWine cache
        if: steps.boxedwine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/boxedwine
          key: boxedwine-uwp-windows2022-x64-official-sdl-v3

      - name: Restore Wine runtime cache
        id: wine-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: runtime-cache/Debian10-Wine-5.0.zip
          key: boxedwine-debian10-wine-5-runtime-v1

      - name: Download Wine runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $uwpFolder = Join-Path `
              $env:BOXEDWINE_ROOT `
              "project\msvc\BoxedWine\uwp"

          $destination = Join-Path $uwpFolder "Debian10-Wine-5.0.zip"
          $cacheFile = Join-Path `
              $env:GITHUB_WORKSPACE `
              "runtime-cache\Debian10-Wine-5.0.zip"
          $temporary = "$destination.part"

          if (
              (Test-Path $cacheFile) -and
              (Get-Item $cacheFile).Length -gt 100MB
          ) {
              Write-Host "Reusing cached Wine runtime."
              Copy-Item $cacheFile $destination -Force
              Get-Item $destination | Select-Object FullName, Length
              exit 0
          }

          choco install wget -y --no-progress

          $baseUrl = "https://sourceforge.net/projects/boxedwine/files/FileSystems/Full/v5/Debian10-Wine-5.0.zip/download"

          $mirrors = @(
              "pilotfiber",
              "phoenixnap",
              "netix",
              "cfhcable",
              "psychz"
          )

          $downloaded = $false

          foreach ($mirror in $mirrors) {
              Write-Host "Trying SourceForge mirror: $mirror"

              Remove-Item $temporary -Force -ErrorAction SilentlyContinue

              & wget.exe `
                  --tries=3 `
                  --timeout=30 `
                  --user-agent="Wget/1.21.4" `
                  --output-document=$temporary `
                  "${baseUrl}?use_mirror=${mirror}"

              if (
                  $LASTEXITCODE -eq 0 -and
                  (Test-Path $temporary) -and
                  (Get-Item $temporary).Length -gt 100MB
              ) {
                  & tar.exe -tf $temporary *> $null

                  if ($LASTEXITCODE -eq 0) {
                      Move-Item $temporary $destination -Force
                      New-Item `
                          -ItemType Directory `
                          -Force `
                          (Split-Path $cacheFile) | Out-Null
                      Copy-Item $destination $cacheFile -Force
                      $downloaded = $true
                      break
                  }
              }
          }

          if (-not $downloaded) {
              throw "Every SourceForge runtime download attempt failed."
          }

          Get-Item $destination | Select-Object FullName, Length

      - name: Save Wine runtime cache
        if: steps.wine-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: runtime-cache/Debian10-Wine-5.0.zip
          key: boxedwine-debian10-wine-5-runtime-v1

      - name: Create temporary package signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $uwpFolder = Join-Path `
              $env:BOXEDWINE_ROOT `
              "project\msvc\BoxedWine\uwp"

          $pfxPath = Join-Path $uwpFolder "uwp_TemporaryKey.pfx"
          $cerPath = Join-Path $env:RUNNER_TEMP "XboxWine-Shelf-TestCertificate.cer"
          $passwordText = [Guid]::NewGuid().ToString("N")
          $password = ConvertTo-SecureString `
              $passwordText `
              -AsPlainText `
              -Force

          $certificate = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=danwo" `
              -FriendlyName "XboxWine Shelf test signing certificate" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -HashAlgorithm SHA256 `
              -KeyExportPolicy Exportable `
              -KeyUsage DigitalSignature `
              -TextExtension @(
                  "2.5.29.37={text}1.3.6.1.5.5.7.3.3",
                  "2.5.29.19={text}"
              )

          Export-PfxCertificate `
              -Cert $certificate `
              -FilePath $pfxPath `
              -Password $password | Out-Null

          Export-Certificate `
              -Cert $certificate `
              -FilePath $cerPath | Out-Null

          "PACKAGE_CERT_PASSWORD=$passwordText" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_CERT_PUBLIC=$cerPath" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Created temporary package certificate for CN=danwo."

      - name: Create Xbox package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $solution = Join-Path `
              $env:BOXEDWINE_ROOT `
              "project\msvc\BoxedWine\BoxedWine.sln"

          $packageFolder = Join-Path `
              $env:GITHUB_WORKSPACE `
              "artifacts\AppPackages"

          New-Item -ItemType Directory -Force $packageFolder | Out-Null

          msbuild.exe $solution `
              /m `
              /restore `
              /t:Build `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /p:GenerateAppxPackageOnBuild=true `
              /p:UapAppxPackageBuildMode=SideloadOnly `
              /p:AppxBundle=Always `
              /p:AppxBundlePlatforms=x64 `
              /p:AppxPackageSigningEnabled=true `
              "/p:PackageCertificateKeyFile=$env:BOXEDWINE_ROOT\project\msvc\BoxedWine\uwp\uwp_TemporaryKey.pfx" `
              "/p:PackageCertificatePassword=$env:PACKAGE_CERT_PASSWORD" `
              "/p:AppxPackageDir=$packageFolder\" `
              /bl:".\logs\package.binlog"

          if ($LASTEXITCODE -ne 0) {
              throw "Package creation failed with exit code $LASTEXITCODE."
          }

          Copy-Item `
              $env:PACKAGE_CERT_PUBLIC `
              (Join-Path $packageFolder "XboxWine-Shelf-TestCertificate.cer") `
              -Force

          $bundle = Get-ChildItem `
              $packageFolder `
              -Recurse `
              -Filter "*0.2.8.0*x64*.msixbundle" |
              Select-Object -First 1

          if (-not $bundle) {
              throw "A v0.2.8.0 x64 MSIX bundle was not produced."
          }

          @"
          XboxWine Shelf v0.2.8.0
          Official SDL2 UWP / Direct3D 11 recovery build
          GitHub run: $env:GITHUB_RUN_NUMBER
          Commit: $env:GITHUB_SHA
          "@ | Set-Content `
              (Join-Path $packageFolder "THIS-IS-XBOXWINE-v0.2.8.txt") `
              -Encoding UTF8

          Get-ChildItem $packageFolder -Recurse |
              Select-Object FullName, Length

      - name: Upload Xbox package
        uses: actions/upload-artifact@v7
        with:
          name: XboxWine-Shelf-v0.2.8-x64
          path: artifacts/AppPackages/
          if-no-files-found: error
          compression-level: 0

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XboxWine-Build-Logs
          path: logs/
          if-no-files-found: ignore
